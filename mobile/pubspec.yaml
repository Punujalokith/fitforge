name: fitforge_app
description: FitForge Member Mobile App
publish_to: 'none'
version: 2.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  percent_indicator: ^4.2.3
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#08081400"
  adaptive_icon_foreground: "assets/launcher_icon.png"
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/
